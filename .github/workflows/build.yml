name: Build EmeraldSMP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn -B clean package
      - name: Verify JAR
        run: |
          test -f target/*.jar
          jar tf target/*.jar | grep -q 'plugin.yml'
          jar tf target/*.jar | grep -q 'net/emeraldsmp/EmeraldSMP.class'
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: EmeraldSMP
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7
